# Render Blueprint Specification for Echoes — A Private Memory Garden
# Docs: https://render.com/docs/blueprint-spec
# GitHub Repository: https://github.com/Tanmay-Dalvi/echoes
version: "1"

services:
  # ---------------------------------------------------------------------------
  # Echoes Backend API (FastAPI)
  # ---------------------------------------------------------------------------
  - type: web
    name: echoes-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: RENDER
        value: "true"
      - key: BACKEND_HOST
        value: 0.0.0.0
      - key: ECHOES_DB_PATH
        value: ./data/echoes.db

  # ---------------------------------------------------------------------------
  # Echoes Frontend Client (React + Vite + Tailwind CSS)
  # Note: Static sites are deployed to Render's global CDN and do not take a region.
  # ---------------------------------------------------------------------------
  - type: web
    name: echoes-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install --include=optional && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: echoes-backend
          property: host
